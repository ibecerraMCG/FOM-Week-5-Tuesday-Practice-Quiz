<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 Tuesday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 5 Tuesday Practice Quiz</h1>

    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>

    <script>
        const quizData = [
            // Carcinogenesis Questions
            {
                learningObjective: "LO1 (Carcinogenesis): Explain the molecular basis of carcinoma with regard to oncogenes, tumor suppressor genes, genes regulating apoptosis, and genes involved in DNA repair.",
                question: "A patient with metastatic melanoma is found to have a BRAF V600E mutation. This mutation results in a constitutively active protein kinase that promotes cell division even in the absence of normal growth signals. The mutated BRAF gene is best classified as which of the following?",
                options: { A: "A proto-oncogene", B: "An oncogene", C: "A tumor suppressor gene", D: "A DNA repair gene" },
                correctAnswer: "B",
                rationale: "A proto-oncogene is a normal gene involved in cell growth. When mutated in a way that leads to a gain of function (e.g., constant activity), it becomes an oncogene, which drives uncontrolled proliferation. The BRAF V600E mutation is a classic example of an activating mutation that converts a proto-oncogene into an oncogene.",
                source: "'So, if gene A is a gene that tells a cell it is time to divide, the mutated form of gene A would tell the cell to divide all the time. Therefore, gene A is a proto-oncogene. Mutated gene A is an oncogene.' (Carcinogenesis and Epidemiology, Slide 7)"
            },
            {
                learningObjective: "LO1 (Carcinogenesis): Explain the molecular basis of carcinoma with regard to oncogenes, tumor suppressor genes, genes regulating apoptosis, and genes involved in DNA repair.",
                question: "A family is identified with Li-Fraumeni syndrome, a hereditary condition that confers a very high risk for multiple types of cancer. This syndrome is caused by an inherited germline mutation in one copy of the TP53 gene. For a tumor to develop in an individual with this syndrome, what additional genetic event must typically occur in a somatic cell?",
                options: { A: "A second, 'somatic' mutation that inactivates the remaining normal copy of TP53", B: "A mutation that activates a nearby oncogene", C: "A translocation of the mutated TP53 gene", D: "Duplication of the inherited mutated TP53 allele" },
                correctAnswer: "A",
                rationale: "TP53 is a tumor suppressor gene. According to the 'two-hit model,' individuals with an inherited cancer syndrome have already inherited one mutated, non-functional copy ('first hit') in all their cells. Cancer develops when a second mutation ('second hit') occurs in a somatic cell, inactivating the one remaining functional copy of the gene, leading to a complete loss of its tumor-suppressing function.",
                source: "'2 hit model... Have to knock out (mutate) BOTH copies of a tumor suppressor gene to cause cancer. Inherited syndromes that predispose to cancer are usually caused by inheriting one bad copy of a tumor suppressor gene.' (Carcinogenesis and Epidemiology, Slide 10)"
            },
            {
                learningObjective: "LO1 (Carcinogenesis): Explain the molecular basis of carcinoma with regard to oncogenes, tumor suppressor genes, genes regulating apoptosis, and genes involved in DNA repair.",
                question: "A patient is diagnosed with follicular lymphoma. Cytogenetic analysis reveals a t(14;18) translocation, which places the BCL2 gene next to the highly active immunoglobulin heavy chain (IGH) gene promoter. This genetic alteration contributes to carcinogenesis by what mechanism?",
                options: { A: "Inactivating a pro-apoptotic gene", B: "Activating a DNA repair gene", C: "Causing constitutive overexpression of an anti-apoptotic gene", D: "Creating a fusion protein with kinase activity" },
                correctAnswer: "C",
                rationale: "BCL2 is an anti-apoptotic gene. The t(14;18) translocation does not mutate the BCL2 protein itself but places it under the control of a powerful promoter (IGH) that is always active in B-cells. This leads to massive overexpression of the BCL2 protein, which prevents apoptosis and makes the lymphoma cells 'invincible,' allowing them to accumulate other mutations.",
                source: "'Anti-apoptotic gene (Example – BCL2) – normally prevents apoptosis. If you translocate this gene adjacent to a gene that is always active, the cell will be in a constant state of anti-apoptosis (i.e. never die/invincible).' (Carcinogenesis and Epidemiology, Slide 13)"
            },
            {
                learningObjective: "LO2 (Carcinogenesis): Describe the role of chemicals, radiation, and infections in carcinogenesis.",
                question: "A patient who worked for many years in construction without proper respiratory protection is diagnosed with mesothelioma. Exposure to which of the following chemical carcinogens is the most well-established cause of this specific type of cancer?",
                options: { A: "Vinyl chloride", B: "Arsenic", C: "Polycyclic hydrocarbons", D: "Asbestos" },
                correctAnswer: "D",
                rationale: "Asbestos is a well-known occupational carcinogen. Inhalation of asbestos fibers is strongly linked to the development of mesothelioma, a rare and aggressive cancer of the lining of the lungs and abdomen.",
                source: "'Occupational exposure carcinogens. Asbestos -> Mesothelioma.' (Carcinogenesis and Epidemiology, Slide 29)"
            },
            {
                learningObjective: "LO2 (Carcinogenesis): Describe the role of chemicals, radiation, and infections in carcinogenesis.",
                question: "A 45-year-old woman is diagnosed with cervical cancer. Molecular testing of the tumor is positive for human papillomavirus (HPV) type 16. The oncogenic potential of high-risk HPV types is primarily mediated by the viral proteins E6 and E7, which act by inhibiting which two key cellular proteins?",
                options: { A: "BCL2 and BAX", B: "MYC and ABL", C: "P53 and RB", D: "BRCA1 and BRCA2" },
                correctAnswer: "C",
                rationale: "The HPV E6 protein targets the tumor suppressor p53 for degradation, while the HPV E7 protein binds to and inactivates the tumor suppressor retinoblastoma protein (RB). The combined inhibition of these two critical cell cycle regulators leads to uncontrolled cell proliferation and genomic instability.",
                source: "'HPV proteins work to inhibit tumor suppressor genes of squamous epithelium (P53, RB).' The diagram on the same slide shows HPV E6 inhibiting p53 and HPV E7 inhibiting RB-E2F interaction. (Carcinogenesis and Epidemiology, Slide 25)"
            },
            {
                learningObjective: "LO2 (Carcinogenesis): Describe the role of chemicals, radiation, and infections in carcinogenesis.",
                question: "Exposure to ultraviolet B (UVB) radiation from sunlight is a major cause of skin cancer. What is the primary mechanism by which UVB directly damages DNA?",
                options: { A: "It causes double-strand breaks in the DNA backbone.", B: "It generates free radicals that oxidize DNA bases.", C: "It causes the formation of covalent bonds between adjacent pyrimidine bases (thymine dimers).", D: "It integrates viral oncogenes into the host genome." },
                correctAnswer: "C",
                rationale: "UVB radiation is directly absorbed by DNA, causing the formation of pyrimidine dimers, most commonly between adjacent thymine bases. These dimers create a physical kink in the DNA helix that blocks replication and transcription. If not repaired by the nucleotide excision repair (NER) pathway, these lesions can lead to mutations and skin cancer.",
                source: "'UVB - major cause. Directly causes skin cancer. Direct DNA damage in skin. Dimerize adjacent Thymine (pyrimidines).' (Carcinogenesis and Epidemiology, Slide 18)"
            },
            {
                learningObjective: "LO3 (Carcinogenesis): Describe and compare the epidemiology of common cancers.",
                question: "According to 2022 epidemiological data for the United States, which cancer is the most commonly diagnosed (highest incidence) in men, and which is the most commonly diagnosed in women?",
                options: { A: "Men: Lung, Women: Lung", B: "Men: Prostate, Women: Breast", C: "Men: Colorectum, Women: Lung", D: "Men: Lung, Women: Breast" },
                correctAnswer: "B",
                rationale: "Based on incidence data, prostate cancer is the most frequently diagnosed cancer in men, while breast cancer is the most frequently diagnosed cancer in women.",
                source: "'Men. Most common: Prostate.' and 'Women. Most common: Breast.' (Carcinogenesis and Epidemiology, Slide 39)"
            },
            {
                learningObjective: "LO3 (Carcinogenesis): Describe and compare the epidemiology of common cancers.",
                question: "While incidence reflects the number of new cases, mortality reflects the deadliest cancers. Based on 2022 data for the United States, which cancer is the leading cause of cancer-related death in both men and women?",
                options: { A: "Pancreatic cancer", B: "Colorectal cancer", C: "Breast cancer", D: "Lung cancer" },
                correctAnswer: "D",
                rationale: "Despite not being the most common in terms of incidence for either sex, lung cancer is by far the deadliest cancer, causing the most cancer-related deaths in both men and women.",
                source: "'Men. Most deadly: Lung.' and 'Women. Most deadly: Lung.' (Carcinogenesis and Epidemiology, Slide 41)"
            },
            {
                learningObjective: "LO3 (Carcinogenesis): Describe and compare the epidemiology of common cancers.",
                question: "A pediatrician is discussing cancer risk with the parents of a young child. Which of the following is the most common malignancy diagnosed in the pediatric population (age 0-19)?",
                options: { A: "Brain tumors", B: "Hodgkin lymphoma", C: "Leukemia", D: "Neuroblastoma" },
                correctAnswer: "C",
                rationale: "Leukemia, particularly B-cell acute lymphoblastic leukemia (B-ALL), is the most common cancer in children. It accounts for the highest number of new cancer diagnoses in the 0-19 age group.",
                source: "'B cell acute lymphoblastic leukemia (B-ALL) ~92% cure rate. Most common cancer.' (Carcinogenesis and Epidemiology, Slide 42) and the bar chart on slide 43 shows 'Leukaemia' with the highest incidence in the 0-19 age group."
            },
            // Nucleotide Metabolism Questions
            {
                learningObjective: "LO1 (Nucleotide Metabolism): Explain the significance of de novo and salvage pathways... and genetic diseases associated with purine metabolism (HGPRT and ADA deficiencies).",
                question: "A 3-year-old boy presents with intellectual disability, spasticity, and a history of biting his own lips and fingertips. Laboratory studies show marked hyperuricemia. These clinical features are characteristic of Lesch-Nyhan syndrome, which is caused by a deficiency in which of the following enzymes?",
                options: { A: "Adenosine deaminase (ADA)", B: "PRPP synthetase", C: "Xanthine oxidase", D: "Hypoxanthine-guanine phosphoribosyltransferase (HGPRT)" },
                correctAnswer: "D",
                rationale: "Lesch-Nyhan syndrome is a severe X-linked disorder caused by a defect in the purine salvage pathway enzyme HGPRT. The inability to salvage hypoxanthine and guanine leads to their degradation to uric acid (hyperuricemia) and an increase in PRPP levels, which drives excessive de novo purine synthesis. The neurologic and behavioral symptoms are hallmarks of the disease.",
                source: "'An absence of the enzyme activity of HGPRT (<2% of normal) due to a genetic defect causes a severe condition called Lesch-Nyhan syndrome... associated with hyperuricemia, gout... severe neurological and behavioral abnormalities, and self-mutilating behavior.' (Nucleotide Metabolism, Slide 10)"
            },
            {
                learningObjective: "LO1 (Nucleotide Metabolism): Explain the significance of de novo and salvage pathways... and genetic diseases associated with purine metabolism (HGPRT and ADA deficiencies).",
                question: "An infant is diagnosed with Severe Combined Immunodeficiency (SCID). The underlying cause is a deficiency in adenosine deaminase (ADA). The immunodeficiency in this disorder results from the accumulation of which toxic metabolite that inhibits ribonucleotide reductase?",
                options: { A: "Uric acid", B: "Deoxyadenosine triphosphate (dATP)", C: "Inosine monophosphate (IMP)", D: "Guanosine monophosphate (GMP)" },
                correctAnswer: "B",
                rationale: "ADA deficiency leads to an accumulation of adenosine and deoxyadenosine. Deoxyadenosine is phosphorylated to dATP. High levels of dATP are toxic, particularly to lymphocytes, because dATP is a potent allosteric inhibitor of ribonucleotide reductase, the enzyme necessary for synthesizing all deoxyribonucleotides for DNA replication. This halts lymphocyte proliferation, causing immunodeficiency.",
                source: "'Genetic Defects in ADA or PNP Cause Autosomal Recessive SCID.' The diagram shows dATP accumulation, which 'Inhibits ribonucleotide reductase', leading to a fall in dNTP levels. (Nucleotide Metabolism, Slide 15)"
            },
            {
                learningObjective: "LO1 (Nucleotide Metabolism): Explain the significance of de novo and salvage pathways... and genetic diseases associated with purine metabolism (HGPRT and ADA deficiencies).",
                question: "A patient with tumor lysis syndrome develops hyperuricemia. To prevent uric acid nephropathy, the patient is started on allopurinol. This drug lowers uric acid levels by inhibiting which of the following enzymes?",
                options: { A: "HGPRT", B: "PRPP amidotransferase", C: "Xanthine oxidase", D: "Adenosine deaminase" },
                correctAnswer: "C",
                rationale: "Xanthine oxidase is the enzyme that catalyzes the final two steps of purine degradation: the conversion of hypoxanthine to xanthine, and xanthine to uric acid. Allopurinol is a structural analog of hypoxanthine that acts as an inhibitor of xanthine oxidase, thereby blocking the production of uric acid.",
                source: "'The drug allopurinol inhibits xanthine oxidase and inhibits the conversion of hypoxanthine and xanthine to uric acid.' (Nucleotide Metabolism, Slide 9)"
            },
            {
                learningObjective: "LO2 (Nucleotide Metabolism): Describe the salient features of pyrimidine nucleotide synthesis and explain the connection between pyrimidine synthesis and urea cycle disorders in the etiology of orotic aciduria.",
                question: "An infant presents with failure to thrive and severe megaloblastic anemia that is unresponsive to vitamin B12 and folate. Urinalysis reveals large amounts of orotic acid. Blood ammonia levels are normal. This presentation is most consistent with a defect in which of the following enzymes?",
                options: { A: "Ornithine transcarbamylase", B: "UMP synthase", C: "Carbamoyl phosphate synthetase I", D: "HGPRT" },
                correctAnswer: "B",
                rationale: "This is a classic presentation of hereditary orotic aciduria, a defect in de novo pyrimidine synthesis. A deficiency in UMP synthase (which has two enzymatic activities, orotate phosphoribosyl transferase and OMP decarboxylase) leads to the accumulation of orotic acid and a failure to produce pyrimidine nucleotides, causing megaloblastic anemia. Normal ammonia levels distinguish it from a urea cycle defect.",
                source: "'Hereditary orotic aciduria. Megaloblastic anemia.' and 'A genetic defect in UMP synthase... will also result in orotic acid accumulation... this condition is also characterized by severe megaloblastic anemia.' (Nucleotide Metabolism, Slide 17)"
            },
            {
                learningObjective: "LO2 (Nucleotide Metabolism): Describe the salient features of pyrimidine nucleotide synthesis and explain the connection between pyrimidine synthesis and urea cycle disorders in the etiology of orotic aciduria.",
                question: "A newborn develops lethargy, vomiting, and hyperammonemia. Laboratory tests reveal elevated urinary orotic acid. These findings are suggestive of a deficiency in ornithine transcarbamylase (OTC), a urea cycle enzyme. What is the biochemical basis for the orotic aciduria in this condition?",
                options: { A: "A primary defect in pyrimidine synthesis leads to a secondary increase in ammonia.", B: "Carbamoyl phosphate from the mitochondria spills into the cytosol and enters the pyrimidine synthesis pathway.", C: "High ammonia levels allosterically activate UMP synthase, increasing orotic acid production.", D: "The defect prevents the salvage of pyrimidines, shunting them to a degradation pathway that produces orotic acid." },
                correctAnswer: "B",
                rationale: "In an OTC deficiency, carbamoyl phosphate produced by CPS I in the mitochondria cannot be combined with ornithine to enter the urea cycle. The excess mitochondrial carbamoyl phosphate leaks into the cytosol, where it becomes a substrate for the de novo pyrimidine synthesis pathway, leading to the overproduction of orotic acid.",
                source: "'Urea cycles disorders in which there is increased production of carbamoyl phosphate... carbamoylphosphate produced by CPS I will ‘spill over’ into pyrimidine synthesis pathway, resulting in increased orotic acid in the plasma as well as urine.' (Nucleotide Metabolism, Slide 18)"
            },
            {
                learningObjective: "LO2 (Nucleotide Metabolism): Describe the salient features of pyrimidine nucleotide synthesis and explain the connection between pyrimidine synthesis and urea cycle disorders in the etiology of orotic aciduria.",
                question: "A patient with hereditary orotic aciduria is treated with dietary uridine. How does this therapy alleviate the symptoms of the disorder?",
                options: { A: "Uridine directly inhibits the production of orotic acid.", B: "Uridine provides a source for pyrimidine nucleotide synthesis, bypassing the enzymatic block.", C: "Uridine is converted to a purine, which feedback-inhibits orotic acid production.", D: "Uridine enhances the residual activity of the deficient UMP synthase." },
                correctAnswer: "B",
                rationale: "In hereditary orotic aciduria, the block is at UMP synthase. Administering uridine allows cells to bypass this block. Uridine can be phosphorylated to UMP, which can then be converted to other necessary pyrimidine nucleotides (UTP, CTP). The resulting UTP also provides feedback inhibition on CPS II, which reduces the de novo production of orotic acid.",
                source: "'Patients are treated with dietary uridine. Exogenous uridine is converted to UMP... exogenous uridine bypasses the defective UMP synthase and supplies cells with pyrimidine nucleotides.' (Nucleotide Metabolism, Slide 17)"
            },
            {
                learningObjective: "LO3 (Nucleotide Metabolism): Describe the ribonucleotide reductase reaction and the synthesis of thymidine nucleotides.",
                question: "The conversion of ribonucleoside diphosphates (NDPs) to deoxyribonucleoside diphosphates (dNDPs) is a critical step for DNA synthesis. This reaction is catalyzed by ribonucleotide reductase. The overall activity of this enzyme is allosterically inhibited by high levels of which molecule?",
                options: { A: "ATP", B: "dATP", C: "GTP", D: "UDP" },
                correctAnswer: "B",
                rationale: "Ribonucleotide reductase has an activity site that controls its overall function. ATP binding to this site activates the enzyme, signaling that energy is available for DNA synthesis. Conversely, dATP binding to this site inactivates the enzyme, providing a negative feedback signal that the pool of deoxyribonucleotides is sufficient.",
                source: "'Either ATP or dATP can bind to the activity site. Binding of ATP will activate the enzyme and binding of dATP will inactivate the enzyme.' (Nucleotide Metabolism, Slide 20)"
            },
            {
                learningObjective: "LO3 (Nucleotide Metabolism): Describe the ribonucleotide reductase reaction and the synthesis of thymidine nucleotides.",
                question: "The synthesis of deoxythymidine monophosphate (dTMP) from deoxyuridine monophosphate (dUMP) is catalyzed by thymidylate synthase. This unique reaction requires a one-carbon donation from which of the following folate coenzymes?",
                options: { A: "N5-methyl-THF", B: "N10-formyl-THF", C: "N5,N10-methylene-THF", D: "Tetrahydrofolate (THF)" },
                correctAnswer: "C",
                rationale: "Thymidylate synthase transfers a methyl group to dUMP to form dTMP. This one-carbon group is provided by N5,N10-methylene-THF, which is simultaneously oxidized to dihydrofolate (DHF) in the process. This makes the reaction a target for antifolate drugs.",
                source: "The diagram on slide 20 shows 'N5,N10-methylene-THF' as the cofactor for the 'Thymidylate synthase' reaction that converts dUMP to dTMP. (Nucleotide Metabolism, Slide 20)"
            },
            {
                learningObjective: "LO3 (Nucleotide Metabolism): Describe the ribonucleotide reductase reaction and the synthesis of thymidine nucleotides.",
                question: "The anticancer drug hydroxyurea is effective in treating certain malignancies by halting cell proliferation. What is the primary molecular target of hydroxyurea?",
                options: { A: "Thymidylate synthase", B: "Dihydrofolate reductase", C: "Ribonucleotide reductase", D: "DNA polymerase" },
                correctAnswer: "C",
                rationale: "Hydroxyurea specifically inhibits ribonucleotide reductase, the enzyme responsible for creating the deoxyribonucleotide building blocks required for DNA synthesis. By blocking this enzyme, hydroxyurea depletes the cell of dNTPs, leading to S-phase arrest and apoptosis.",
                source: "'Hydroxyurea used as an anticancer drug inhibits the enzyme [ribonucleotide reductase].' (Nucleotide Metabolism, Slide 20)"
            },
            {
                learningObjective: "LO4 (Nucleotide Metabolism): Apply principles of nucleotide metabolism to the mechanisms of action of 6-mercaptopurine, 5-fluorouracil, and methotrexate.",
                question: "A patient with acute lymphoblastic leukemia is being treated with methotrexate. This drug is a structural analog of folate and exerts its chemotherapeutic effect by directly and competitively inhibiting which of the following enzymes?",
                options: { A: "Thymidylate synthase", B: "Dihydrofolate reductase (DHFR)", C: "HGPRT", D: "Ribonucleotide reductase" },

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;
                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;
                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect. The correct answer is ${qData.correctAnswer}.</span>`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });
